name: Portfolio quality

on:
  push:
    branches: [main, "polish/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Responsive browser smoke test
        run: node scripts/viewport-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-viewport-previews
          path: viewport-previews/
          if-no-files-found: ignore
